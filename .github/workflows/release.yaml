name: Build desktop

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Bump patch version for a new main commit
        id: version
        shell: bash
        run: |
          git fetch origin main --tags
          git checkout -B release-main origin/main
          if [[ -n "$(git tag --points-at HEAD --list 'v*.*.*')" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected a major.minor.patch version in package.json" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          next="$major.$minor.$((patch + 1))"
          while git rev-parse --verify --quiet "refs/tags/v$next" >/dev/null; do
            patch=$((patch + 1))
            next="$major.$minor.$((patch + 1))"
          done
          npm pkg set "version=$next"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json
          git commit -m "Release a.webo v$next"
          git push origin HEAD:main
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'))
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: --win nsis portable --x64
            artifact: a-webo-windows-x64
            files: |
              dist/a-webo-setup_x64.exe
              dist/a-webo-setup_x64.exe.blockmap
              dist/a-webo-portable_x64.exe
              dist/latest.yml
          - name: Linux x64
            os: ubuntu-latest
            target: --linux AppImage --x64
            artifact: a-webo-linux-x64
            files: |
              dist/a-webo_x86_64.AppImage
              dist/latest-linux.yml
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 90

  release:
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'))
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" --generate-notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha || github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
